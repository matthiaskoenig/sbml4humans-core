<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBML Rust reader</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172b3a;background:#f4f7fa}body{max-width:960px;margin:48px auto;padding:0 24px}h1{font-size:2rem;margin-bottom:8px}p{color:#465d70;line-height:1.6}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:24px 0}button,.file{border:1px solid #197d76;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;background:#fff;color:#12675f}button:first-child{background:#12675f;color:white}button:disabled{opacity:.5;cursor:default}input{max-width:270px}#status{min-height:24px;font-weight:600}pre{background:#fff;border:1px solid #d8e3eb;border-radius:12px;padding:24px;overflow:auto;max-height:55vh;font-size:13px;line-height:1.5}
</style>
<h1>SBML Rust reader</h1>
<p>Read SBML locally with native WebAssembly. Parsing, units, package objects, equations and graph construction run in a worker. Your file stays in this browser.</p>
<div class="actions"><button id="example" disabled>Load example</button><label class="file">Open SBML <input id="file" type="file" disabled accept=".xml,.sbml,.gz,.omex,.zip"></label><button id="cancel" disabled>Cancel</button><button id="download" disabled>Download report</button></div>
<p id="status" role="status" data-testid="status">Starting parser…</p><pre id="output">Choose an SBML file or load the bundled example.</pre>
<script type="module">
import { createReader } from '../index.mjs';
const status=document.querySelector('#status'),output=document.querySelector('#output'),cancel=document.querySelector('#cancel'),download=document.querySelector('#download');
let reader,controller,report;
try{reader=await createReader();status.textContent='Ready';document.querySelector('#example').disabled=false;document.querySelector('#file').disabled=false;}catch(error){status.textContent=error.message;}
async function read(source,label){
 controller?.abort();const current=controller=new AbortController();cancel.disabled=false;download.disabled=true;status.textContent=`Reading ${label}…`;const started=performance.now();
 try{const result=await reader.source(source,{signal:current.signal});report=result;const model=Object.values(result.reports)[0]?.report.models[0];status.textContent=`Ready: ${model?.id||label}, ${(performance.now()-started).toFixed(0)} ms`;output.textContent=JSON.stringify(result,null,2);download.disabled=false;}
 catch(error){if(controller===current){status.textContent=error.name==='AbortError'?'Cancelled':error.message;}}
 finally{if(controller===current)cancel.disabled=true;}
}
document.querySelector('#example').onclick=async()=>{try{await read(await(await fetch('../../testdata/comp_internal.xml')).arrayBuffer(),'comp example');}catch(error){status.textContent=error.message;}};
document.querySelector('#file').onchange=async(event)=>{const file=event.target.files[0];if(file)await read(await file.arrayBuffer(),file.name);};
cancel.onclick=()=>controller?.abort();download.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='sbml-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
addEventListener('pagehide',()=>reader?.dispose());
</script>
</html>
