[workspace]
resolver = "3"
members = ["crates/abi", "crates/cli", "crates/libsbml", "crates/model", "crates/oracles", "crates/report"]
default-members = ["crates/abi", "crates/cli", "crates/libsbml", "crates/model", "crates/report"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/sbml4humans-core"

[workspace.dependencies]
cc = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
