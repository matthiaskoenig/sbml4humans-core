[workspace]
resolver = "3"
members = ["crates/abi", "crates/libsbml", "crates/model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/sbml4humans-core"

[workspace.dependencies]
cc = "1"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
