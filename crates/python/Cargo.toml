[package]
name = "sbml4humans-python"
description = "Native Python host of the shared Rust SBML report pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
validation = ["dep:sbml4humans-libsbml", "dep:tempfile"]

[dependencies]
sbml4humans-core = { path = "../core" }
serde_json.workspace = true
serde.workspace = true
tempfile = { version = "3", optional = true }
pyo3 = { version = "0.30", features = ["abi3-py312"] }
sbml4humans-libsbml = { path = "../libsbml", optional = true }

[lints]
workspace = true
