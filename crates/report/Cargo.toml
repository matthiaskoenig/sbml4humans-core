[package]
name = "sbml4humans-report"
description = "The serde types of the report of sbml4humans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sbmlsim-ode = { git = "https://github.com/matthiaskoenig/sbmlsim-core.git", rev = "0ab8b628becc739b1a4117dd689ce6660be33732" }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sbml4humans-model = { path = "../model" }

# the builder reads the model of `sbml4humans-model` alone and nothing of libsbml, which the
# tests read a document with: a fixture of theirs is a document of SBML and no model built by hand,
# so that the report they assert on is the report of a file an end user holds
[dev-dependencies]
sbml4humans-libsbml = { path = "../libsbml" }
