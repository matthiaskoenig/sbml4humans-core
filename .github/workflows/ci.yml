name: CI

on:
  push:
  pull_request:

# least privilege
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the build dependencies of libsbml
        run: sudo apt-get update && sudo apt-get install --yes cmake libexpat1-dev zlib1g-dev libbz2-dev
      - name: Cache the libsbml prefix
        id: libsbml
        uses: actions/cache@v6
        with:
          path: third_party/prefix
          # the source build happens once per change of the script
          key: libsbml-${{ runner.os }}-${{ hashFiles('scripts/build-libsbml.sh') }}
      - name: Build libsbml
        if: steps.libsbml.outputs.cache-hit != 'true'
        run: bash scripts/build-libsbml.sh
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check the format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --features sbml4humans-python/validation -- -D warnings
      - name: Test
        run: cargo test --workspace --release --locked --features sbml4humans-python/validation

  native:
    name: native (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build native wheel without libSBML
        run: uv tool run --from 'maturin>=1.16,<2' maturin build --release --locked --out dist
      - name: Install and test the wheel
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python -m unittest discover -s python/tests -q

  native-validation:
    name: native validation (Python ${{ matrix.python }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake libexpat1-dev zlib1g-dev libbz2-dev
      - name: Restore the libSBML prefix built by the Rust test job
        uses: actions/cache/restore@v6
        with:
          path: third_party/prefix
          key: libsbml-${{ runner.os }}-${{ hashFiles('scripts/build-libsbml.sh') }}
          fail-on-cache-miss: true
      - name: Build validation-enabled ABI3 wheel
        run: uv tool run --from 'maturin[patchelf]>=1.16,<2' maturin build --release --locked --features validation --out dist
      - name: Test the installed native validator and complete reports
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python dist/*.whl
          .venv/bin/python -c 'import sbml4humans_core as c; assert c.VALIDATION_CONTRACT == "validation/1"'
          .venv/bin/python -m unittest discover -s python/tests -q

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install Rust and the native WASM target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Build and check complete reports in Node
        working-directory: js
        run: |
          npm ci
          npm run build
          npm test
      - name: Check browser worker and example
        working-directory: js
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
